[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-predicate"
version = "0.1.0"
authors = [{name = "Maurits Rijk", email = "maurits.rijk@gmail.com"}]
description = "Pytest integration for py-predicate"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["pytest", "pytest-plugin", "predicate", "py-predicate", "testing", "assertions"]
dependencies = [
    "py-predicate>=1.11",
    "pytest>=8",
]
classifiers = [
    "Framework :: Pytest",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/mrijk/pytest-predicate"
Issues = "https://github.com/mrijk/pytest-predicate/issues"
Changelog = "https://github.com/mrijk/pytest-predicate/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
predicate = "pytest_predicate.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytest_predicate = ["py.typed"]
